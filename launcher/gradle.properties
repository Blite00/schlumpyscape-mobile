# required for building jre_lwjgl3glfw with Java 8 while using plugins in app_pojavlauncher that require Java 11
org.gradle.configureondemand=true

android.useAndroidX=true
android.bundle.language.enableSplit=false
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# Java 8 toolchain for the jre_lwjgl3glfw module (Gradle cannot auto-detect a non-standard JDK path)
org.gradle.java.installations.paths=/opt/jdk8
